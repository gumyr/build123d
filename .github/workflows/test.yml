name: tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]
        os: [
          macos-15-intel, 
          macos-14, 
          ubuntu-latest, 
          windows-latest, 
          ubuntu-24.04-arm
        ]
        vtk: [false]
        include:
          - python-version: "3.10"
            os: ubuntu-latest
            vtk: false

          - python-version: "3.13"
            os: ubuntu-latest
            vtk: true

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          persist-credentials: false

      - name: Patch pyproject.toml for build123d-vtk variant
        if: matrix.vtk == true
        run: |
          sed -i 's/name = "build123d"/name = "build123d-vtk"/' pyproject.toml
          sed -i 's/cadquery-ocp-novtk/cadquery-ocp/' pyproject.toml

      - uses: ./.github/actions/setup/
        with:
          python-version: ${{ matrix.python-version }}
          optional-dependencies: "development"

      - name: test
        run: |
          python -m pytest -n auto --benchmark-disable
